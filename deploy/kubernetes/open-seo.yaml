apiVersion: v1
kind: Namespace
metadata:
  name: by-freddie-seo
  annotations:
    byfreddie/registration: temporary-user-authorized-unregistered
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-seo
  namespace: by-freddie-seo
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-seo
  template:
    metadata:
      labels:
        app: open-seo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ocaye-dev
      containers:
        - name: open-seo
          image: ghcr.io/every-app/open-seo@sha256:14385c1e7e3fe815f8aaab0ced939421306a9e6a2b4da8a15d1c76c510ed624c
          ports:
            - containerPort: 3001
          env:
            - {name: PORT, value: '3001'}
            - {name: AUTH_MODE, value: local_noauth}
            - {name: CLOUDFLARE_INCLUDE_PROCESS_ENV, value: 'true'}
            - {name: OPENSEO_TELEMETRY_DISABLED, value: '1'}
            - {name: DO_NOT_TRACK, value: '1'}
            - {name: VITE_SHOW_DEVTOOLS, value: 'false'}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 4Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: 3001}
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet: {path: /api/health, port: 3001}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - {name: data, mountPath: /app/.wrangler}
      volumes:
        - name: data
          hostPath:
            path: /var/local/by-freddie-seo/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: open-seo
  namespace: by-freddie-seo
spec:
  type: ClusterIP
  selector:
    app: open-seo
  ports:
    - {port: 3001, targetPort: 3001}
